plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.miniapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.miniapp"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // Java derleyici sürümünü 17 yapıyoruz (Eksik olan yer burasıydı)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Kotlin derleyici sürümünü 17 yapıyoruz
    kotlinOptions {
        jvmTarget = '17'
    }
}
